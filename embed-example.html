<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed example</title>
<meta name="robots" content="noindex">
<!-- Stand-in for a host page (e.g. thomassie.me/projects/...): its own tokens, a fixed header, a content column,
     and deliberately unfriendly global styles. The embed must look right anyway (tools/page_check tests it). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  body { margin: 0; font-family: Georgia, serif; background: var(--paper); }
  h1, h2, h3, p, li { margin: 2em 0; color: green; }
  ul { list-style: square; padding-left: 3em; }
  a { text-decoration: underline wavy; }
  button, select, input { font-size: 22px; border: 3px dashed orange; }
  img, canvas { border: 4px solid magenta; }
  .site-header { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 10; display: flex; align-items: center;
    padding: 0 24px; background: var(--paper); border-bottom: 1px solid var(--rule); font-family: Helvetica, Arial, sans-serif; }
  .content { max-width: 1100px; margin: 0 auto; padding: 72px 16px 64px; }
</style>
<link rel="stylesheet" href="slc.css">
</head>
<body>
<header class="site-header">thomassie.me · Focus: Climate Change</header>
<div class="content">
  <h1>Sea-level Cities</h1>
  <div id="sea-level-cities" data-header="false" data-sticky-top="56"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="scrolly.js"></script>
<script src="block3d.js"></script>
<script src="staff.js"></script>
<script src="slc.js"></script>
</body>
</html>
